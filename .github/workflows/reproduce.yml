name: Full reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-reproduction
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m unittest discover -s tests -v
      - name: Download fixed dataset and run all 12 configurations
        run: python reproduce.py all --jobs 2
      - name: Save verification, metrics and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-evidence
          include-hidden-files: true
          path: |
            .reproduction/reports/
            .reproduction/runs/reproduction/**/result.json
            .reproduction/data/inventory.json
          if-no-files-found: warn
          retention-days: 14
